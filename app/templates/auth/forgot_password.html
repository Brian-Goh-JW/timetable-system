{% extends 'base.html' %}
{% block title %}Forgot Password - SIT Timetable{% endblock %}
{% block content %}<div class="mx-auto" style="max-width:480px"><div class="card border-0 shadow-sm"><div class="card-body p-4">
<h4>Password reset</h4><p class="text-muted">Enter your timetable account email. Reset links expire after 30 minutes.</p>
<form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input class="form-control mb-3" type="email" name="email" required autocomplete="email"><button class="btn btn-primary w-100">Send reset link</button></form>
</div></div></div>{% endblock %}
