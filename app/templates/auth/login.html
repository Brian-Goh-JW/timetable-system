<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIT Timetable System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
        }
        .sit-header {
            background-color: #c0272d;
            color: white;
            padding: 1.25rem 1.5rem;
            border-radius: 0.5rem 0.5rem 0 0;
        }
        .sit-header h4 {
            margin: 0;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .sit-header p {
            margin: 0.25rem 0 0;
            font-size: 0.85rem;
            opacity: 0.85;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <div class="login-card">
        <!-- Header -->
        <div class="sit-header">
            <h4>SIT Timetable System</h4>
            <p>Engineering Cluster - Timetabling System</p>
        </div>

        <!-- Card body -->
        <div class="card border-top-0 rounded-top-0 shadow-sm">
            <div class="card-body p-4">
                <h5 class="mb-4 text-secondary fw-normal">Sign in to your account</h5>

                <!-- Flash messages -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show py-2" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endwith %}

                <!-- Login form -->
                <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-medium">Email address</label>
                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="your@sit.edu.sg"
                            required
                            autofocus
                        >
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-medium">Password</label>
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn w-100" style="background-color:#c0272d; color:white;">
                        Sign In
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
