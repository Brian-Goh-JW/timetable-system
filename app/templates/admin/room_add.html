{% extends 'base.html' %}
{% block title %}Add Room - SIT Timetable{% endblock %}

{% block content %}

<div class="mx-auto" style="max-width:520px">
    <div class="mb-4">
        <a href="{{ url_for('admin.rooms') }}" class="text-decoration-none text-muted small">
            <i class="bi bi-arrow-left me-1"></i>Back to Rooms
        </a>
        <h4 class="fw-semibold mt-2 mb-0">Add Room</h4>
    </div>

    <div class="card border-0 shadow-sm">
    <div class="card-body p-4">
                <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="room_code" class="form-label fw-medium">
                            Room Code <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="room_code" name="room_code"
                               value="{{ form.get('room_code', '') }}"
                               placeholder="e.g. E2-05-01" required>
                        <div class="form-text">Must be unique. Will be converted to uppercase.</div>
                    </div>

                    <div class="mb-3">
                        <label for="building" class="form-label fw-medium">
                            Building <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="building" name="building"
                               value="{{ form.get('building', '') }}"
                               placeholder="e.g. E2" required>
                    </div>

                    <div class="mb-3">
                        <label for="capacity" class="form-label fw-medium">
                            Capacity <span class="text-danger">*</span>
                        </label>
                        <input type="number" class="form-control" id="capacity" name="capacity"
                               value="{{ form.get('capacity', '') }}"
                               min="1" placeholder="e.g. 40" required>
                    </div>

                    <div class="mb-4">
                        <label for="room_type" class="form-label fw-medium">
                            Room Type <span class="text-danger">*</span>
                        </label>
                        <select class="form-select" id="room_type" name="room_type" required>
                            <option value="" disabled selected>Select a type</option>
                            <option value="lecture"  {% if form.get('room_type') == 'lecture'  %}selected{% endif %}>Lecture</option>
                            <option value="lab"      {% if form.get('room_type') == 'lab'      %}selected{% endif %}>Lab</option>
                            <option value="seminar"  {% if form.get('room_type') == 'seminar'  %}selected{% endif %}>Seminar</option>
                        </select>
                    </div>

                    <div class="mb-3"><label class="form-label fw-medium">Equipment Tags</label><input class="form-control" name="equipment" value="{{ form.get('equipment','') }}" placeholder="projector, wet-lab, computers"><div class="form-text">Comma-separated; sessions may require these tags.</div></div>
                    <div class="form-check mb-4"><input class="form-check-input" type="checkbox" name="is_accessible" id="accessible" {% if form.get('is_accessible') %}checked{% endif %}><label class="form-check-label" for="accessible">Wheelchair accessible</label></div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn text-white" style="background-color:#c0272d;">
                            <i class="bi bi-plus-lg me-1"></i>Add Room
                        </button>
                        <a href="{{ url_for('admin.rooms') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>

                </form>
            </div>
        </div>
    </div>

{% endblock %}
