{% extends 'base.html' %}
{% block title %}Reset Password - SIT Timetable{% endblock %}
{% block content %}<div class="mx-auto" style="max-width:480px"><div class="card border-0 shadow-sm"><div class="card-body p-4">
<h4>Choose a new password</h4><form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input class="form-control mb-2" type="password" name="new_password" required minlength="10" placeholder="New password"><div class="form-text mb-3">At least 10 characters with uppercase, lowercase, and a number.</div><input class="form-control mb-3" type="password" name="confirm_password" required placeholder="Confirm password"><button class="btn btn-primary w-100">Reset password</button></form>
</div></div></div>{% endblock %}
