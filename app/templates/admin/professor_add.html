{% extends 'base.html' %}
{% block title %}Add Professor - SIT Timetable{% endblock %}

{% block content %}

<div class="mx-auto" style="max-width:600px">
    <div class="mb-4">
        <a href="{{ url_for('admin.professors') }}" class="text-decoration-none text-muted small">
            <i class="bi bi-arrow-left me-1"></i>Back to Professors
        </a>
        <h4 class="fw-semibold mt-2 mb-0">Add Professor</h4>
    </div>

    <div class="card border-0 shadow-sm">
    <div class="card-body p-4">
                <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="name" class="form-label fw-medium">
                            Full Name <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="name" name="name"
                               value="{{ form.get('name', '') }}"
                               placeholder="e.g. David Lin Weidong" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-medium">
                            Email Address <span class="text-danger">*</span>
                        </label>
                        <input type="email" class="form-control" id="email" name="email"
                               value="{{ form.get('email', '') }}"
                               placeholder="e.g. davidlin@sit.edu.sg" required>
                        <div class="form-text">This will be their login email.</div>
                    </div>

                    <div class="mb-3">
                        <label for="staff_id" class="form-label fw-medium">
                            Staff ID <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="staff_id" name="staff_id"
                               value="{{ form.get('staff_id', '') }}"
                               placeholder="e.g. A100909" required>
                    </div>

                    <div class="mb-3">
                        <label for="department" class="form-label fw-medium">
                            Department <span class="text-danger">*</span>
                        </label>
                        <select class="form-select" id="department" name="department" required>
                            <option value="" disabled {% if not form.get('department') %}selected{% endif %}>Select department</option>
                            {% for dept in departments %}
                            <option value="{{ dept }}" {% if form.get('department') == dept %}selected{% endif %}>{{ dept }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-medium">
                            Temporary Password <span class="text-danger">*</span>
                        </label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Set a temporary password for first login"
                               minlength="8" autocomplete="new-password" required>
                        <div class="form-text">
                            Share this with the professor. They should change it after logging in.
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn text-white" style="background-color:#c0272d;">
                            <i class="bi bi-person-plus me-1"></i>Add Professor
                        </button>
                        <a href="{{ url_for('admin.professors') }}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                    </div>

                </form>
            </div>
        </div>
    </div>

{% endblock %}
